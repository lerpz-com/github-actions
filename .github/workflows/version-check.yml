name: Validate the package version

on:
  workflow_call:
    inputs:
      validate_override:
        description: Always validate the package version
        required: false
        type: boolean
        default: false

      deploy_env:
        description: Deployment environment (prod, stag or dev)
        required: true
        type: string

      package_version:
        description: The version of the package.
        required: true
        type: string

jobs:
  validate-version:
    if: |
      inputs.deploy_env == 'prod' ||
      inputs.deploy_env == 'stag' ||
      inputs.build_override
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release exsists
        if: inputs.deploy_env == 'prod'
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          if git rev-parse "refs/tags/$PACKAGE_VERSION" >/dev/null 2>&1; then
              echo "Tag $PACKAGE_VERSION already exists."
              exit 1
          else
              echo "Tag $PACKAGE_VERSION does not exists."
              exit 0
          fi
